TrainingArguments:
  num_train_epochs: 1  # or your desired value
  warmup_steps: 500
  per_device_train_batch_size: 1
  weight_decay: 0.01
  logging_steps: 10
  eval_strategy: "steps"  # This should be "steps", "epoch", or "no"
  eval_steps: 500
  save_steps: 1000000  # or 1e6 in scientific notation
  gradient_accumulation_steps: 16